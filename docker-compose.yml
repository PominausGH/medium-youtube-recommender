version: '3.8'

services:
  app:
    build: .
    container_name: content-curator
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ${OBSIDIAN_VAULT:-/share/Obsidian}:/obsidian
      - ${PROJECTS_PATH:-/share/Projects}:/projects
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    restart: unless-stopped

